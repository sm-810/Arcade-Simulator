<body class = "PAC">
  <h1 class = "Hamburger">
    Pac...Pigeon!
  </h1>

<div class="RulesContainer">
  <div class="RulesContent">
    <h1>Wow a pop up</h1>
    <p>Rules of the Game: </p>
    <ol>
      <li>You have three lives! </li> </br> 
      <li>Collect the crumbs of bread! </li>
      <li>And of course, avoid the pigeons! </li>
      <li>Unfortunately, no mobile support yet.</li>
    </ol>
    <p>...</p>
    <div class = "buttons"> 
    <button class = "gotIt">Got it!</button>
    </div>
  </div>
</div>

<div class="PopCornContainer">
  <div class="PopCornContent">
    <h1>Wow a pop up</h1>
    <p>Results: </p>
    <p>Score: </p><p class = "score">x</p>
   <div class = "buttons"> 
    <button class = "accept">That's fine!</button>
    <button class = "round">Again! </button> 
    </div>
     </div>
  </div>
  <canvas id = "Map"></canvas>
  <script src="script.js"></script>
</body>
