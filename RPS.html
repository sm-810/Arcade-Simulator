<!DOCTYPE html>
<html lang="en">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double&family=Coral+Pixels&family=Doto:wght@100..900&family=Monoton&family=Space+Grotesk:wght@300..700&family=VT323&display=swap" rel="stylesheet">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>810_Arcade (Mildly Retro)</title>
</head>

<body class = "RPSetUp">
  <h1 class = "bigNamesRock">810's Arcade Games</h1>
  <div class = "NeonSignRock">ROCK PAPER SCISSORS</div>

<div class="RulesContainer">
  <div class="RulesContent">
    <h1>Wow a pop up</h1>
    <p>Rules of the Game: </p>
    <ol>
      <li>The game is 5 rounds!</li>
      <li>You only have two seconds to respond after "...and Shoot!"</li>
      <li>If you let the time run out, you lose that round.</li>
    </ol>
    <p>...</p>
    <div class = "buttons"> 
    <button class = "gotIt">Got it!</button>
    </div>
  </div>
</div>

<div class="PopCornContainer">
  <div class="PopCornContent">
    <h1>Wow a pop up</h1>
    <p>Results: </p>
    <div class = "Results">
    <p class = "computer">x</p>
      <p> - </p>
    <p class = "tie">x</p>
      <p> - </p>
    <p class = "user">x</p>
    </div>
    <div class = "buttons"> 
    <button class = "accept">That's fine!</button>
    <button class = "round">Again! </button> 
    </div>
  </div>
</div>

  <div id="countdownText">...</div>
 <div class="playingField">
  <div class="tv-container">
    <img src="TVGreen.png" alt="Opponent TV" />
    <div id = "computerScreen">
      <img src = "scissors2.png" class = "ActionMoves1"> 
    </div>
  </div>

  <div class="tv-container">
    <img src="TVPink.png" alt="Player TV" />
    <div id="playerScreen">
      <img src = "scissors2.png" class = "ActionMoves2"> 
    </div>
  </div>
</div>

  <div class = "PlayerMoves">
    <img src = "rockhand.png" class = "rock"> 
    <img src = "paperhand.png" class = "paper">
    <img src = "scissors2.png" class = "scissors">
  </div>
  <script src="script.js"></script>
</body>

</html>
